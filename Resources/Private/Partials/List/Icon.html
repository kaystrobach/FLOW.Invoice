<f:comment>
    Small status and action icons. Argument: name (edit, circle, clock, alert, check, slash, back, play, download, open)
</f:comment>
<f:switch expression="{name}">
    <f:case value="edit"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 11l1-3 5.5-5.5 2 2L6 10l-3 1z"/></svg></f:case>
    <f:case value="circle"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/></svg></f:case>
    <f:case value="clock"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M7 4.5V7l1.8 1.2"/></svg></f:case>
    <f:case value="alert"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 1.8l5.5 9.7h-11z"/><path d="M7 5.5v2.8M7 10v.1"/></svg></f:case>
    <f:case value="check"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg></f:case>
    <f:case value="slash"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M3.5 10.5l7-7"/></svg></f:case>
    <f:case value="back"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5L2.5 6 5 8.5"/><path d="M2.5 6h6a3 3 0 010 6h-2"/></svg></f:case>
    <f:case value="play"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 3l6 4-6 4z"/></svg></f:case>
    <f:case value="download"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v8m0 0l-3-3m3 3l3-3"/><path d="M3.5 12.5v2h11v-2"/></svg></f:case>
    <f:case value="open"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l4 4-4 4"/></svg></f:case>
    <f:defaultCase></f:defaultCase>
</f:switch>
